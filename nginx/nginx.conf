events {}

http {
    # Docker's embedded DNS server.
    #
    # nginx resolves the names in a normal `upstream` block once, at config
    # load. `docker compose up --build` recreates the API containers with new
    # IPs but leaves nginx running, so those cached addresses go stale and
    # nginx keeps proxying to a container that no longer exists. The instance
    # is dropped from the pool silently: proxy_next_upstream retries the
    # request elsewhere, so the client still sees 200 and nothing looks wrong.
    # A short TTL here means a recreated instance is picked back up in seconds.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        # api1, api2 and api3 all answer to the `api` alias (see
        # docker-compose.yml), so Docker's DNS returns all three addresses and
        # rotates their order on each lookup -- that rotation is what spreads
        # requests across the instances.
        #
        # The address has to go through a variable. Written literally, nginx
        # would resolve it once at startup and we would be back to stale IPs.
        set $api_backend "api:8000";

        location / {
            proxy_pass http://$api_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Don't retry a 429 on the next instance - that would hand the
            # client a second chance at a limit it already used up. Only
            # genuine connection failures are retried.
            proxy_next_upstream error timeout;
        }
    }
}
